<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Chaos</title>

<style>
* {
    box-sizing: border-box;
    user-select: none;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #02030a;
    font-family: Arial, Helvetica, sans-serif;
    color: white;
}

body {
    cursor: crosshair;
}

canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* =========================
   SCREENS
========================= */

.screen {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    background:
        radial-gradient(circle at center, rgba(25,35,80,.35), rgba(0,0,0,.88));
}

.panel {
    width: min(650px, 90vw);
    padding: 45px;
    text-align: center;
    backdrop-filter: blur(8px);
    border-radius: 18px;
    background: transparent;
    border: 1px solid #65bfff;
    box-shadow:
        0 0 18px #257cff,
        inset 0 0 18px rgba(37,124,255,.2);
}

.title {
    margin: 0;
    font-size: clamp(55px, 10vw, 100px);
    letter-spacing: 8px;
    color: #fff;
    text-shadow:
        0 0 10px #65bfff,
        0 0 35px #257cff,
        0 0 70px rgba(40,120,255,.6);
}

.subtitle {
    margin-top: 8px;
    color: #8fb8d8;
    letter-spacing: 4px;
    text-transform: uppercase;
}

button {
    margin-top: 30px;
    padding: 15px 42px;
    border-radius: 8px;
    font-size: 18px;
    font-weight: bold;
    letter-spacing: 3px;
    cursor: pointer;
    transition: .2s;
  background: transparent;
    border: 2px solid #69c7ff;
    color: #ffffff;
    box-shadow: 0 0 10px rgba(70,180,255,.5);
}

button:hover {
    background: rgba(70,170,255,.35);
    transform: translateY(-2px);
  background: transparent;
    border-color: #ffffff;
    box-shadow:
        0 0 12px #ffffff,
        0 0 28px #46b4ff;
}



.controls {
    margin-top: 30px;
    color: #8c9aaa;
    line-height: 1.8;
    font-size: 14px;
}

.hidden {
    display: none !important;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;
    inset: 0;
    z-index: 5;
    pointer-events: none;
}

.hudBox {
    position: absolute;
    top: 20px;
    padding: 10px 15px;
    border-left: 2px solid #64c8ff;
    background: rgba(0,10,25,.45);
    text-shadow: 0 0 8px #65caff;
}

#scoreBox {
    left: 20px;
}

#highBox {
    right: 20px;
    border-left: none;
    border-right: 2px solid #64c8ff;
    text-align: right;
}

.hudLabel {
    color: #7092aa;
    font-size: 10px;
    letter-spacing: 2px;
}

.hudValue {
    font-size: 24px;
    font-weight: bold;
}

#warning {
    position: absolute;
    left: 50%;
    top: 25px;
    transform: translateX(-50%);
    color: #ff4646;
    font-weight: bold;
    letter-spacing: 3px;
    opacity: 0;
    text-shadow: 0 0 15px red;
    white-space: nowrap;
}

#tractorStatus {
    position: absolute;
    left: 50%;
    bottom: 30px;
    transform: translateX(-50%);
    color: #55ff9c;
    font-size: 13px;
    letter-spacing: 2px;
    opacity: 0;
    text-shadow: 0 0 12px #00ff80;
}

#wormStatus {
    position: absolute;
    left: 50%;
    bottom: 55px;
    transform: translateX(-50%);
    color: #e06cff;
    font-size: 15px;
    font-weight: bold;
    letter-spacing: 3px;
    opacity: 0;
    text-shadow: 0 0 15px #c020ff;
}

#chaosStatus {
    position: absolute;
    left: 50%;
    top: 65px;
    transform: translateX(-50%);
    color: #ffd45c;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    opacity: 0;
    text-shadow: 0 0 12px #ff9d00;
}

/* =========================
   GAME OVER
========================= */

.failTitle {
    color: #ff4848;
    text-shadow:
        0 0 10px red,
        0 0 35px rgba(255,0,0,.6);
}

.finalScore {
    font-size: 30px;
    margin-top: 20px;
}

.newHigh {
    margin-top: 10px;
    color: #70d9ff;
    letter-spacing: 3px;
}




  
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="homeScreen" class="screen">
    <div class="panel">
        <h1 class="title">SPACE CHAOS</h1>
        <div class="subtitle">Survive the void</div>

        <button id="startButton">LAUNCH</button>

        <div class="controls">
            <b>MOUSE</b> — Aim<br>
            <b>LEFT CLICK / Z</b> — Fire<br>
            <b>SPACE</b> — Thrust<br>
            <b>P</b> — Pause
        </div>
    </div>
</div>

<div id="hud" class="hidden">

    <div id="scoreBox" class="hudBox">
        <div class="hudLabel">SCORE</div>
        <div id="score" class="hudValue">0</div>
    </div>

    <div id="highBox" class="hudBox">
        <div class="hudLabel">HIGH SCORE</div>
        <div id="highScore" class="hudValue">0</div>
    </div>

    <div id="warning">⚠ HOSTILE BEAM</div>

    <div id="tractorStatus">
        TRACTOR BEAM — MOVEMENT REDUCED
    </div>

    <div id="wormStatus">
        🪱 GIANT SPACE WORM
    </div>

    <div id="chaosStatus">
        CHAOS EVENT
    </div>

</div>

<div id="failScreen" class="screen hidden">
    <div class="panel">

        <h1 class="title failTitle">MISSION FAILED</h1>

        <div class="finalScore">
            SCORE: <span id="finalScore">0</span>
        </div>

        <div id="newHigh" class="newHigh hidden">
            NEW HIGH SCORE
        </div>

        <button id="replayButton">REPLAY</button>
        <br>
        <button id="homeButton">HOME</button>

    </div>
</div>

<script>

/* ============================================================
   SPACE CHAOS
============================================================ */

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W = innerWidth;
let H = innerHeight;

function resize() {
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
}

addEventListener("resize", resize);
resize();

/* ============================================================
   DOM
============================================================ */

const homeScreen = document.getElementById("homeScreen");
const failScreen = document.getElementById("failScreen");
const hud = document.getElementById("hud");

const scoreEl = document.getElementById("score");
const highScoreEl = document.getElementById("highScore");
const finalScoreEl = document.getElementById("finalScore");
const newHighEl = document.getElementById("newHigh");

const warningEl = document.getElementById("warning");
const tractorStatus = document.getElementById("tractorStatus");
const wormStatus = document.getElementById("wormStatus");
const chaosStatus = document.getElementById("chaosStatus");

const startButton = document.getElementById("startButton");
const replayButton = document.getElementById("replayButton");
const homeButton = document.getElementById("homeButton");

/* ============================================================
   GAME STATE
============================================================ */

let gameRunning = false;
let paused = false;

let score = 0;

let highScore =
    Number(localStorage.getItem("spaceChaosHighScore")) || 0;

highScoreEl.textContent = highScore;

let keys = {};

let mouse = {
    x: W / 2,
    y: H / 2,
    down: false
};

let lastTime = 0;

let spawnTimer = 0;
let alienTimer = 0;
let satelliteTimer = 0;
let starTimer = 0;
let chaosTimer = 0;
let wormTimer = 8;

let shake = 0;

const stars = [];
const asteroids = [];
const bullets = [];
const particles = [];
const aliens = [];
const satellites = [];
const shootingStars = [];
const beams = [];

/* ============================================================
   INPUT
============================================================ */

addEventListener("mousemove", e => {
    mouse.x = e.clientX;
    mouse.y = e.clientY;
});

addEventListener("mousedown", e => {
    if (e.button === 0) {
        mouse.down = true;
    }
});

addEventListener("mouseup", e => {
    if (e.button === 0) {
        mouse.down = false;
    }
});

addEventListener("keydown", e => {

    keys[e.code] = true;

    if (
        e.code === "Space" ||
        e.code === "ArrowUp" ||
        e.code === "ArrowDown" ||
        e.code === "ArrowLeft" ||
        e.code === "ArrowRight"
    ) {
        e.preventDefault();
    }

    if (e.code === "KeyP" && gameRunning) {
        paused = !paused;
    }
});

addEventListener("keyup", e => {
    keys[e.code] = false;
});

/* ============================================================
   UTILITY
============================================================ */

function random(min, max) {
    return Math.random() * (max - min) + min;
}

function distance(a, b) {
    return Math.hypot(
        a.x - b.x,
        a.y - b.y
    );
}

function angleTo(a, b) {
    return Math.atan2(
        b.y - a.y,
        b.x - a.x
    );
}

function wrap(obj, padding = 50) {

    if (obj.x < -padding) {
        obj.x = W + padding;
    }

    if (obj.x > W + padding) {
        obj.x = -padding;
    }

    if (obj.y < -padding) {
        obj.y = H + padding;
    }

    if (obj.y > H + padding) {
        obj.y = -padding;
    }
}

function normalizeAngle(a) {

    while (a > Math.PI) {
        a -= Math.PI * 2;
    }

    while (a < -Math.PI) {
        a += Math.PI * 2;
    }

    return a;
}

/* ============================================================
   BACKGROUND
============================================================ */

function createBackground() {

    stars.length = 0;

    for (let i = 0; i < 180; i++) {

        stars.push({
            x: random(0, W),
            y: random(0, H),
            size: random(.4, 2),
            alpha: random(.2, .9),
            speed: random(5, 25)
        });
    }
}

createBackground();

function drawBackground(dt) {

    ctx.fillStyle = "#02030a";
    ctx.fillRect(0, 0, W, H);

    const gradient = ctx.createRadialGradient(
        W / 2,
        H / 2,
        0,
        W / 2,
        H / 2,
        Math.max(W, H) * .7
    );

    gradient.addColorStop(0, "#07142c");
    gradient.addColorStop(.5, "#030817");
    gradient.addColorStop(1, "#010207");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {

        s.y += s.speed * dt;

        if (s.y > H) {
            s.y = 0;
            s.x = random(0, W);
        }

        ctx.globalAlpha = s.alpha;

        ctx.fillStyle = "#b9ddff";

        ctx.beginPath();
        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI * 2
        );
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

/* ============================================================
   PLAYER
============================================================ */

const player = {

    x: W / 2,
    y: H / 2,

    vx: 0,
    vy: 0,

    radius: 18,

    angle: 0,

    thrustPower: .19,

    friction: .992,

    fireCooldown: 0,

    alive: true
};

function resetPlayer() {

    player.x = W / 2;
    player.y = H / 2;

    player.vx = 0;
    player.vy = 0;

    player.alive = true;

    player.fireCooldown = 0;
}

/* ============================================================
   PLAYER DRAW
============================================================ */

function drawPlayer() {
    if (!player.alive) return;

    ctx.save();

    ctx.translate(player.x, player.y);
    ctx.rotate(player.angle);

    ctx.shadowBlur = 18;
    ctx.shadowColor = "#55c8ff";

    // White outer border
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2.5;

    ctx.beginPath();
    ctx.moveTo(22, 0);
    ctx.lineTo(-14, -11);
    ctx.lineTo(-9, 0);
    ctx.lineTo(-14, 11);
    ctx.closePath();
    ctx.stroke();

    // Blue inner neon border
    ctx.shadowColor = "#3298dc";
    ctx.strokeStyle = "#3298dc";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.moveTo(12, 0);
    ctx.lineTo(-8, -6);
    ctx.lineTo(-4, 0);
    ctx.lineTo(-8, 6);
    ctx.closePath();
    ctx.stroke();

    // Thrust outline
    if (keys["Space"]) {
        ctx.shadowColor = "#8eeaff";
        ctx.strokeStyle = "#8eeaff";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(-10, 0);
        ctx.lineTo(-26 - Math.random() * 10, -5);
        ctx.lineTo(-20 - Math.random() * 12, 0);
        ctx.lineTo(-26 - Math.random() * 10, 5);
        ctx.closePath();
        ctx.stroke();
    }

    ctx.restore();
}

/* ============================================================
   THRUST PARTICLES
============================================================ */

function createThrustParticle() {

    const a = player.angle + Math.PI;

    particles.push({

        x:
            player.x -
            Math.cos(player.angle) * 13,

        y:
            player.y -
            Math.sin(player.angle) * 13,

        vx:
            Math.cos(a) * random(1, 3) +
            player.vx * .2,

        vy:
            Math.sin(a) * random(1, 3) +
            player.vy * .2,

        size: random(2, 5),

        life: random(.25, .55),

        maxLife: .55,

        type:
            Math.random() < .5
            ? "smoke"
            : "ice"
    });
}

/* ============================================================
   PLAYER MOVEMENT
============================================================ */

function updatePlayer(dt) {

    player.angle = angleTo(
        player,
        mouse
    );

    const thrusting = keys["Space"];

    if (thrusting) {

        player.vx +=
            Math.cos(player.angle) *
            player.thrustPower *
            dt *
            60;

        player.vy +=
            Math.sin(player.angle) *
            player.thrustPower *
            dt *
            60;

        if (Math.random() < .8) {
            createThrustParticle();
        }
    }

    let tractor = false;

    for (const alien of aliens) {

        if (alien.beamType !== "green") {
            continue;
        }

        if (alien.state !== "flying") {
            continue;
        }

        const d = distance(
            player,
            alien
        );

        if (d < alien.beamRange) {

            tractor = true;

            const a = angleTo(
                player,
                alien
            );

            player.vx -=
                Math.cos(a) *
                .025 *
                dt *
                60;

            player.vy -=
                Math.sin(a) *
                .025 *
                dt *
                60;

            player.vx *= .992;
            player.vy *= .992;
        }
    }

    tractorStatus.style.opacity =
        tractor ? 1 : 0;

    player.vx *=
        Math.pow(
            player.friction,
            dt * 60
        );

    player.vy *=
        Math.pow(
            player.friction,
            dt * 60
        );

    const maxSpeed =
        tractor ? 4.5 : 9;

    const speed = Math.hypot(
        player.vx,
        player.vy
    );

    if (speed > maxSpeed) {

        player.vx =
            player.vx /
            speed *
            maxSpeed;

        player.vy =
            player.vy /
            speed *
            maxSpeed;
    }

    player.x +=
        player.vx *
        dt *
        60;

    player.y +=
        player.vy *
        dt *
        60;

    wrap(player, 20);
}

/* ============================================================
   SHOOTING
============================================================ */

function shoot() {

    if (!player.alive) return;

    if (player.fireCooldown > 0) {
        return;
    }

    player.fireCooldown = .12;

    const speed = 13;

    bullets.push({

        x:
            player.x +
            Math.cos(player.angle) *
            20,

        y:
            player.y +
            Math.sin(player.angle) *
            20,

        vx:
            Math.cos(player.angle) *
            speed +
            player.vx * .4,

        vy:
            Math.sin(player.angle) *
            speed +
            player.vy * .4,

        life: 1.2,

        radius: 3
    });
}

function updateBullets(dt) {

    player.fireCooldown -= dt;

    if (
        mouse.down ||
        keys["KeyZ"]
    ) {
        shoot();
    }

    for (
        let i = bullets.length - 1;
        i >= 0;
        i--
    ) {

        const b = bullets[i];

        b.x +=
            b.vx *
            dt *
            60;

        b.y +=
            b.vy *
            dt *
            60;

        b.life -= dt;

        if (
            b.life <= 0 ||
            b.x < -100 ||
            b.x > W + 100 ||
            b.y < -100 ||
            b.y > H + 100
        ) {
            bullets.splice(i, 1);
        }
    }
}

function drawBullets() {
    for (const b of bullets) {
        ctx.save();

        ctx.shadowBlur = 16;
        ctx.shadowColor = "#7ee7ff";
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.arc(
            b.x,
            b.y,
            b.radius,
            0,
            Math.PI * 2
        );

        ctx.stroke();

        ctx.restore();
    }
}

/* ============================================================
   ASTEROIDS
============================================================ */

function createAsteroid(
    size,
    x,
    y,
    forcedAngle = null
) {

    const radius =
        size === 3
        ? random(40, 60)
        : size === 2
        ? random(23, 36)
        : random(12, 19);

    let px = x;
    let py = y;

    if (
        px === undefined ||
        py === undefined
    ) {

        const edge =
            Math.floor(
                random(0, 4)
            );

        if (edge === 0) {
            px = random(0, W);
            py = -radius;
        }

        if (edge === 1) {
            px = W + radius;
            py = random(0, H);
        }

        if (edge === 2) {
            px = random(0, W);
            py = H + radius;
        }

        if (edge === 3) {
            px = -radius;
            py = random(0, H);
        }
    }

    const speed =
        size === 3
        ? random(.4, 1.2)
        : size === 2
        ? random(.8, 1.8)
        : random(1.5, 3);

    const a =
        forcedAngle === null
        ? random(0, Math.PI * 2)
        : forcedAngle;

    const points =
        Math.floor(
            random(8, 12)
        );

    const shape = [];

    for (let i = 0; i < points; i++) {

        shape.push({

            angle:
                i / points *
                Math.PI * 2,

            radius:
                radius *
                random(.72, 1.15)
        });
    }

    asteroids.push({

        x: px,
        y: py,

        vx:
            Math.cos(a) *
            speed,

        vy:
            Math.sin(a) *
            speed,

        radius,

        size,

        rotation:
            random(0, Math.PI * 2),

        rotationSpeed:
            random(-.025, .025),

        shape
    });
}

function spawnAsteroid() {

    let size = 3;

    if (Math.random() < .55) {
        size = 2;
    }

    if (Math.random() < .2) {
        size = 1;
    }

    createAsteroid(size);
}

function drawAsteroids() {
    for (const a of asteroids) {
        ctx.save();

        ctx.translate(a.x, a.y);
        ctx.rotate(a.rotation);

        ctx.shadowBlur = 12;
        ctx.shadowColor = "#9aa6b5";

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;

        ctx.beginPath();

        a.shape.forEach((p, i) => {
            const x = Math.cos(p.angle) * p.radius;
            const y = Math.sin(p.angle) * p.radius;

            if (i === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        });

        ctx.closePath();
        ctx.stroke();

        // Neon inner asteroid border
        ctx.shadowColor = "#68778a";
        ctx.strokeStyle = "#68778a";
        ctx.lineWidth = 1;

        ctx.beginPath();

        a.shape.forEach((p, i) => {
            const x = Math.cos(p.angle) * p.radius * 0.78;
            const y = Math.sin(p.angle) * p.radius * 0.78;

            if (i === 0) {
                ctx.moveTo(x, y);
            } else {
                ctx.lineTo(x, y);
            }
        });

        ctx.closePath();
        ctx.stroke();

        ctx.restore();
    }
}

function updateAsteroids(dt) {

    for (const a of asteroids) {

        a.x +=
            a.vx *
            dt *
            60;

        a.y +=
            a.vy *
            dt *
            60;

        a.rotation +=
            a.rotationSpeed *
            dt *
            60;

        wrap(
            a,
            a.radius + 10
        );
    }
}

/* ============================================================
   ASTEROID SPLITTING
============================================================ */

function splitAsteroid(index) {

    const a = asteroids[index];

    const points =
        a.size === 3
        ? 20
        : a.size === 2
        ? 35
        : 60;

    score += points;

    createExplosion(
        a.x,
        a.y,
        a.radius
    );

    shake =
        Math.min(
            12,
            shake +
            a.radius / 8
        );

    if (a.size > 1) {

        const newSize =
            a.size - 1;

        const baseAngle =
            Math.atan2(
                a.vy,
                a.vx
            );

        const angle1 =
            baseAngle +
            random(.6, 1.2);

        const angle2 =
            baseAngle -
            random(.6, 1.2);

        const speed =
            Math.max(
                1.2,
                Math.hypot(
                    a.vx,
                    a.vy
                ) * 1.15
            );

        createAsteroidFromSplit(
            a,
            newSize,
            angle1,
            speed
        );

        createAsteroidFromSplit(
            a,
            newSize,
            angle2,
            speed
        );
    }

    asteroids.splice(
        index,
        1
    );

    updateScore();
}

function createAsteroidFromSplit(
    parent,
    size,
    angle,
    speed
) {

    const radius =
        size === 2
        ? random(23, 36)
        : random(12, 19);

    const points =
        Math.floor(
            random(7, 11)
        );

    const shape = [];

    for (let i = 0; i < points; i++) {

        shape.push({

            angle:
                i / points *
                Math.PI * 2,

            radius:
                radius *
                random(.75, 1.15)
        });
    }

    asteroids.push({

        x:
            parent.x +
            Math.cos(angle) * 10,

        y:
            parent.y +
            Math.sin(angle) * 10,

        vx:
            Math.cos(angle) *
            speed,

        vy:
            Math.sin(angle) *
            speed,

        radius,
        size,

        rotation:
            random(
                0,
                Math.PI * 2
            ),

        rotationSpeed:
            random(-.04, .04),

        shape
    });
}

/* ============================================================
   ALIEN SHIPS
============================================================ */

function createAlien() {

    const fromLeft =
        Math.random() < .5;

    aliens.push({

        x:
            fromLeft
            ? -80
            : W + 80,

        y:
            random(
                70,
                H - 70
            ),

        vx:
            fromLeft
            ? random(1.2, 2.2)
            : random(-2.2, -1.2),

        speed:
            random(1.2, 2.4),

        life:
            random(7, 12),

        beamType:
            Math.random() < .5
            ? "red"
            : "green",

        beamRange:
            random(240, 360),

        fireTimer:
            random(1.5, 3),

        wobble:
            random(0, 10),

        angle:
            fromLeft
            ? 0
            : Math.PI,

        state: "flying",

        laserTimer: 0
    });
}

function updateAliens(dt) {

    for (
        let i = aliens.length - 1;
        i >= 0;
        i--
    ) {

        const alien = aliens[i];

        /*
           NORMAL FLYING
        */

        if (
            alien.state === "flying"
        ) {

            alien.x +=
                alien.vx *
                dt *
                60;

            alien.wobble += dt;

            alien.y +=
                Math.sin(
                    alien.wobble * 2
                ) *
                .4;

            alien.life -= dt;

            alien.fireTimer -= dt;

            /*
               RED LASER
            */

            if (
                alien.beamType === "red" &&
                alien.fireTimer <= 0
            ) {

                startAlienLaser(
                    alien
                );

                alien.fireTimer =
                    random(4, 7);
            }
        }

        /*
           LASER WARNING
           THE ALIEN IS COMPLETELY STOPPED.
        */

        else if (
            alien.state ===
            "laserWarning"
        ) {

            alien.vx = 0;

            alien.laserTimer -= dt;

            if (
                alien.laserTimer <= 0
            ) {

                alien.state = "laser";

                const beam =
                    beams.find(
                        b =>
                            b.alien === alien
                    );

                if (beam) {

                    beam.state =
                        "active";

                    beam.timer =
                        .75;
                }

                alien.laserTimer =
                    .75;
            }
        }

        /*
           LASER FIRING
           STILL COMPLETELY STOPPED.
        */

        else if (
            alien.state === "laser"
        ) {

            alien.vx = 0;

            alien.laserTimer -= dt;

            if (
                alien.laserTimer <= 0
            ) {

                alien.state = "flying";

                alien.vx =
                    alien.x <
                    W / 2
                    ? alien.speed
                    : -alien.speed;
            }
        }

        if (
            alien.life <= 0 &&
            alien.state === "flying"
        ) {

            aliens.splice(i, 1);
            continue;
        }

        if (
            alien.x < -180 ||
            alien.x > W + 180
        ) {

            aliens.splice(i, 1);
        }
    }
}

/* ============================================================
   ALIEN LASER START
============================================================ */

function startAlienLaser(alien) {

    /*
       Alien freezes here.
    */

    alien.state =
        "laserWarning";

    /*
       Aim roughly toward the player,
       but deliberately offset it so
       the laser isn't perfectly locked
       onto the player's current position.
    */

    const directAngle =
        Math.atan2(
            player.y - alien.y,
            player.x - alien.x
        );

    const offset =
        Math.random() < .5
        ? -random(.45, .9)
        : random(.45, .9);

    const angle =
        directAngle + offset;

    alien.laserAngle = angle;

    alien.laserTimer =
        1.35;

    beams.push({

        type: "red",

        alien,

        x: alien.x,
        y: alien.y,

        angle,

        state: "warning",

        timer: 1.35,

        width: 12,

        maxWidth: 32
    });

    warningEl.textContent =
        "⚠ LASER LOCK — DODGE!";

    warningEl.style.opacity = 1;
}

/* ============================================================
   ALIEN LASERS
============================================================ */

function updateBeams(dt) {

    let warning = false;

    let active = false;

    for (
        let i = beams.length - 1;
        i >= 0;
        i--
    ) {

        const beam = beams[i];

        beam.timer -= dt;

        /*
           Warning phase.
        */

        if (
            beam.state ===
            "warning"
        ) {

            warning = true;

            if (
                beam.timer <= 0
            ) {

                beam.state =
                    "active";

                beam.timer =
                    .75;

                if (beam.alien) {

                    beam.alien.state =
                        "laser";

                    beam.alien.laserTimer =
                        .75;
                }
            }
        }

        /*
           Active laser.
        */

        else if (
            beam.state ===
            "active"
        ) {

            active = true;

            /*
               Make sure it follows
               the frozen alien position.
            */

            beam.x =
                beam.alien.x;

            beam.y =
                beam.alien.y;

            const length =
                Math.max(
                    W,
                    H
                ) * 2.5;

            const x2 =
                beam.x +
                Math.cos(
                    beam.angle
                ) *
                length;

            const y2 =
                beam.y +
                Math.sin(
                    beam.angle
                ) *
                length;

            /*
               Wider but still dodgeable.
            */

            const hit =
                pointToLineDistance(
                    player.x,
                    player.y,
                    beam.x,
                    beam.y,
                    x2,
                    y2
                );

            if (
                hit <
                player.radius +
                12
            ) {

                failGame();
                return;
            }
        }

        if (
            beam.timer <= 0 &&
            beam.state ===
            "active"
        ) {

            beams.splice(i, 1);
        }
    }

    if (warning) {

        warningEl.style.opacity =
            .65 +
            Math.sin(
                performance.now() *
                .018
            ) *
            .35;

        warningEl.textContent =
            "⚠ LASER LOCK — DODGE!";

    } else if (!active) {

        warningEl.style.opacity = 0;
    }
}

function pointToLineDistance(
    px,
    py,
    x1,
    y1,
    x2,
    y2
) {

    const dx =
        x2 - x1;

    const dy =
        y2 - y1;

    const lengthSquared =
        dx * dx +
        dy * dy;

    if (
        lengthSquared === 0
    ) {

        return Math.hypot(
            px - x1,
            py - y1
        );
    }

    let t =
        (
            (px - x1) * dx +
            (py - y1) * dy
        ) /
        lengthSquared;

    t =
        Math.max(
            0,
            Math.min(
                1,
                t
            )
        );

    const x =
        x1 +
        t * dx;

    const y =
        y1 +
        t * dy;

    return Math.hypot(
        px - x,
        py - y
    );
}

function drawBeams() {

    for (const beam of beams) {

        if (
            beam.type !== "red"
        ) {
            continue;
        }

        const length =
            Math.max(
                W,
                H
            ) * 2.5;

        const x2 =
            beam.x +
            Math.cos(
                beam.angle
            ) *
            length;

        const y2 =
            beam.y +
            Math.sin(
                beam.angle
            ) *
            length;

        ctx.save();

        /*
           WARNING
        */

        if (
            beam.state ===
            "warning"
        ) {

            const pulse =
                .5 +
                Math.sin(
                    performance.now() *
                    .02
                ) *
                .5;

            ctx.globalAlpha =
                .22 +
                pulse * .25;

            ctx.shadowBlur = 20;
            ctx.shadowColor =
                "#ff1738";

            ctx.strokeStyle =
                "#ff3045";

            ctx.lineWidth =
                10 +
                pulse * 10;

            ctx.setLineDash([
                30,
                18
            ]);

            ctx.beginPath();

            ctx.moveTo(
                beam.x,
                beam.y
            );

            ctx.lineTo(
                x2,
                y2
            );

            ctx.stroke();

            ctx.setLineDash([]);

            ctx.globalAlpha = .9;

            ctx.lineWidth = 3;

            ctx.strokeStyle =
                "#ff8b96";

            ctx.beginPath();

            ctx.moveTo(
                beam.x,
                beam.y
            );

            ctx.lineTo(
                x2,
                y2
            );

            ctx.stroke();
        }

        /*
           ACTIVE
        */

        else {

            ctx.shadowBlur = 40;
            ctx.shadowColor =
                "#ff102f";

            ctx.strokeStyle =
                "rgba(255,20,40,.35)";

            ctx.lineWidth = 42;

            ctx.beginPath();

            ctx.moveTo(
                beam.x,
                beam.y
            );

            ctx.lineTo(
                x2,
                y2
            );

            ctx.stroke();

            ctx.shadowBlur = 20;

            ctx.strokeStyle =
                "#ff233f";

            ctx.lineWidth = 25;

            ctx.beginPath();

            ctx.moveTo(
                beam.x,
                beam.y
            );

            ctx.lineTo(
                x2,
                y2
            );

            ctx.stroke();

            ctx.strokeStyle =
                "#fff";

            ctx.lineWidth = 5;

            ctx.beginPath();

            ctx.moveTo(
                beam.x,
                beam.y
            );

            ctx.lineTo(
                x2,
                y2
            );

            ctx.stroke();
        }

        ctx.restore();
    }
}

/* ============================================================
   ALIEN DRAW
============================================================ */

function drawAliens() {
    for (const alien of aliens) {
        ctx.save();

        ctx.translate(alien.x, alien.y);

        const mainColor =
            alien.beamType === "red"
                ? "#ff2038"
                : "#35ff9b";

        ctx.shadowBlur = 20;
        ctx.shadowColor = mainColor;

        // White outer alien border
        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(24, 0);
        ctx.lineTo(8, -13);
        ctx.lineTo(-17, -8);
        ctx.lineTo(-24, 0);
        ctx.lineTo(-17, 8);
        ctx.lineTo(8, 13);
        ctx.closePath();
        ctx.stroke();

        // Colored inner border
        ctx.strokeStyle = mainColor;
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(18, 0);
        ctx.lineTo(6, -8);
        ctx.lineTo(-13, -5);
        ctx.lineTo(-18, 0);
        ctx.lineTo(-13, 5);
        ctx.lineTo(6, 8);
        ctx.closePath();
        ctx.stroke();

        // Cockpit outline
        ctx.strokeStyle =
            alien.beamType === "red"
                ? "#ff5a69"
                : "#72ffbd";

        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.ellipse(0, -4, 9, 5, 0, 0, Math.PI * 2);
        ctx.stroke();

        if (alien.state === "laserWarning") {
            const pulse =
                .5 +
                Math.sin(performance.now() * .02) * .5;

            ctx.strokeStyle = "#ff3045";
            ctx.lineWidth = 3 + pulse * 3;

            ctx.beginPath();
            ctx.arc(0, 0, 32 + pulse * 5, 0, Math.PI * 2);
            ctx.stroke();
        }

        ctx.restore();

        // Tractor beam outline
        if (
            alien.beamType === "green" &&
            alien.state === "flying"
        ) {
            const d = distance(player, alien);

            if (d < alien.beamRange) {
                ctx.save();

                ctx.shadowBlur = 18;
                ctx.shadowColor = "#00ff82";
                ctx.strokeStyle = "#35ff9b";
                ctx.lineWidth = 2;

                ctx.beginPath();
                ctx.moveTo(alien.x - 12, alien.y + 8);
                ctx.lineTo(player.x - 35, player.y);
                ctx.lineTo(player.x + 35, player.y);
                ctx.lineTo(alien.x + 12, alien.y + 8);
                ctx.closePath();
                ctx.stroke();

                ctx.restore();
            }
        }
    }
}

function createSatellite() {

    const side =
        Math.floor(
            random(0, 4)
        );

    let x;
    let y;

    if (side === 0) {
        x = -80;
        y = random(100, H - 100);
    }

    if (side === 1) {
        x = W + 80;
        y = random(100, H - 100);
    }

    if (side === 2) {
        x = random(100, W - 100);
        y = -80;
    }

    if (side === 3) {
        x = random(100, W - 100);
        y = H + 80;
    }

    const targetX =
        W / 2;

    const targetY =
        H / 2;

    const a =
        Math.atan2(
            targetY - y,
            targetX - x
        );

    satellites.push({

        x,
        y,

        vx:
            Math.cos(a) *
            random(.7, 1.3),

        vy:
            Math.sin(a) *
            random(.7, 1.3),

        rotation:
            random(
                0,
                Math.PI * 2
            ),

        rotationSpeed:
            random(-.01, .01),

        radius: 25,

        life: 20
    });
}

function updateSatellites(dt) {

    for (
        let i = satellites.length - 1;
        i >= 0;
        i--
    ) {

        const s =
            satellites[i];

        s.x +=
            s.vx *
            dt *
            60;

        s.y +=
            s.vy *
            dt *
            60;

        s.rotation +=
            s.rotationSpeed *
            dt *
            60;

        s.life -= dt;

        if (
            s.life <= 0 ||
            s.x < -150 ||
            s.x > W + 150 ||
            s.y < -150 ||
            s.y > H + 150
        ) {

            satellites.splice(
                i,
                1
            );
        }
    }
}

function drawSatellites() {
    for (const s of satellites) {
        ctx.save();

        ctx.translate(s.x, s.y);
        ctx.rotate(s.rotation);

        ctx.shadowBlur = 14;
        ctx.shadowColor = "#ffd85c";

        ctx.strokeStyle = "#ffffff";
        ctx.lineWidth = 2;

        ctx.strokeRect(-8, -6, 16, 12);
        ctx.strokeRect(-28, -4, 17, 8);
        ctx.strokeRect(11, -4, 17, 8);

        ctx.strokeStyle = "#ffd85c";

        ctx.beginPath();
        ctx.moveTo(0, -6);
        ctx.lineTo(0, -18);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(0, -20, 3, 0, Math.PI * 2);

        ctx.restore();
    }
}

    });
}

function updateShootingStars(dt) {

    for (
        let i =
            shootingStars.length - 1;
        i >= 0;
        i--
    ) {

        const s =
            shootingStars[i];

        s.x +=
            s.vx *
            dt *
            60;

        s.y +=
            s.vy *
            dt *
            60;

        s.life -= dt;

        if (

        ) {

            );

function drawShootingStars() {

    for (
        const s of shootingStars
    ) {

        const speed =
            Math.hypot(
                s.vx,
                s.vy
            );

        const nx =
            s.vx / speed;

        const ny =
            s.vy / speed;

        ctx.save();

        ctx.globalAlpha =
            Math.min(
                1,
                s.life
            );

        ctx.shadowBlur = 15;
        ctx.shadowColor =
            "#ffffff";

        ctx.strokeStyle =
            "#ffffff";

        ctx.lineWidth = 2;

        ctx.beginPath();

        ctx.moveTo(
            s.x,
            s.y
        );

        ctx.lineTo(
            s.x -
            nx *
            s.length,

            s.y -
            ny *
            s.length
        );

        ctx.stroke();

        ctx.restore();
    }
}

/* ============================================================
   SPACE WORM
============================================================ */

const worm = {

    active: false,

    state: "idle",

    x: 0,
    y: 0,

    vx: 0,
    vy: 0,

    angle: 0,

    speed: 2.2,

    radius: 45,

    segmentCount: 17,

    spacing: 27,

    segments: [],

    life: 0,

    target: null,

    targetTimer: 0,

    turnTimer: 0
};

/* ============================================================
   SPAWN WORM
============================================================ */

function spawnWorm() {

    worm.active = true;

    worm.state = "enter";

    const side =
        Math.floor(
            random(0, 4)
        );

    if (side === 0) {

        worm.x = -450;
        worm.y = random(0, H);

        worm.angle =
            random(
                -.7,
                .7
            );
    }

    if (side === 1) {

        worm.x = W + 450;
        worm.y = random(0, H);

        worm.angle =
            Math.PI +
            random(
                -.7,
                .7
            );
    }

    if (side === 2) {

        worm.x = random(0, W);
        worm.y = -450;

        worm.angle =
            Math.PI / 2 +
            random(
                -.7,
                .7
            );
    }

    if (side === 3) {

        worm.x = random(0, W);
        worm.y = H + 450;

        worm.angle =
            -Math.PI / 2 +
            random(
                -.7,
                .7
            );
    }

    worm.vx =
        Math.cos(
            worm.angle
        ) *
        worm.speed *
        60;

    worm.vy =
        Math.sin(
            worm.angle
        ) *
        worm.speed *
        60;

    worm.life =
        random(
            8,
            15
        );

    worm.target = null;

    worm.targetTimer = 0;

    worm.segments = [];

    for (
        let i = 0;
        i < worm.segmentCount;
        i++
    ) {

        worm.segments.push({

            x:
                worm.x -
                Math.cos(
                    worm.angle
                ) *
                i *
                worm.spacing,

            y:
                worm.y -
                Math.sin(
                    worm.angle
                ) *
                i *
                worm.spacing,

            size:
                worm.radius *
                (
                    1 -
                    i /
                    worm.segmentCount *
                    .65
                )
        });
    }

    wormStatus.style.opacity = 1;

    warningEl.textContent =
        "⚠ GIANT SPACE WORM INBOUND!";

    warningEl.style.opacity = 1;

    shake = 12;
}

/* ============================================================
   WORM TARGET
============================================================ */

function chooseWormTarget() {

    const targets = [];

    for (
        const asteroid of asteroids
    ) {

        targets.push({
            object: asteroid,
            type: "asteroid"
        });
    }

    for (
        const star of shootingStars
    ) {

        targets.push({
            object: star,
            type: "star"
        });
    }

    for (
        const alien of aliens
    ) {

        targets.push({
            object: alien,
            type: "alien"
        });
    }

    if (!targets.length) {

        worm.target = null;
        return;
    }

    let closest = null;

    let closestDistance =
        750;

    for (
        const target of targets
    ) {

        const d =
            distance(
                worm,
                target.object
            );

        if (
            d <
            closestDistance
        ) {

            closestDistance = d;
            closest = target;
        }
    }

    worm.target = closest;
}

/* ============================================================
   WORM UPDATE
============================================================ */

function updateWorm(dt) {

    if (!worm.active) {

        wormTimer -= dt;

        if (
            wormTimer <= 0
        ) {

            spawnWorm();
        }

        return;
    }

    worm.life -= dt;

    worm.targetTimer -= dt;

    if (
        worm.targetTimer <= 0
    ) {

        chooseWormTarget();

        worm.targetTimer =
            random(
                .5,
                1.1
            );
    }

    /*
       Eventually leave.
    */

    if (
        worm.life <= 0 &&
        worm.state !== "exit"
    ) {

        worm.state = "exit";

        worm.target = null;
    }

    let desiredAngle =
        worm.angle;

    /*
       EXIT
    */

    if (
        worm.state === "exit"
    ) {

        const edgeTargets = [

            {
                x: -600,
                y: worm.y
            },

            {
                x: W + 600,
                y: worm.y
            },

            {
                x: worm.x,
                y: -600
            },

            {
                x: worm.x,
                y: H + 600
            }
        ];

        let nearest =
            edgeTargets[0];

        let nearestDistance =
            Infinity;

        for (
            const target of edgeTargets
        ) {

            const d =
                Math.hypot(
                    target.x -
                    worm.x,

                    target.y -
                    worm.y
                );

            if (
                d <
                nearestDistance
            ) {

                nearestDistance = d;
                nearest = target;
            }
        }

        desiredAngle =
            Math.atan2(
                nearest.y -
                worm.y,

                nearest.x -
                worm.x
            );
    }

    /*
       CHASE SOMETHING
    */

    else if (
        worm.target
    ) {

        desiredAngle =
            Math.atan2(
                worm.target.object.y -
                worm.y,

                worm.target.object.x -
                worm.x
            );
    }

    /*
       RANDOM WANDER
    */

    else {

        worm.turnTimer -= dt;

        if (
            worm.turnTimer <= 0
        ) {

            desiredAngle =
                worm.angle +
                random(
                    -1.2,
                    1.2
                );

            worm.turnTimer =
                random(
                    .7,
                    1.5
                );
        }
    }

    let difference =
        normalizeAngle(
            desiredAngle -
            worm.angle
        );

    difference =
        Math.max(
            -1.8 * dt,
            Math.min(
                1.8 * dt,
                difference
            )
        );

    worm.angle += difference;

    const speed =
        worm.state === "exit"
        ? 3.4
        : worm.speed;

    worm.vx =
        Math.cos(
            worm.angle
        ) *
        speed *
        60;

    worm.vy =
        Math.sin(
            worm.angle
        ) *
        speed *
        60;

    worm.x +=
        worm.vx *
        dt;

    worm.y +=
        worm.vy *
        dt;

    updateWormSegments();

    if (
        worm.state === "enter" &&
        worm.x > -100 &&
        worm.x < W + 100 &&
        worm.y > -100 &&
        worm.y < H + 100
    ) {

        worm.state =
            "roaming";
    }

    wormEatThings();

    /*
       Worm leaves screen.
    */

    if (
        worm.state === "exit" &&
        (
            worm.x < -700 ||
            worm.x > W + 700 ||
            worm.y < -700 ||
            worm.y > H + 700
        )
    ) {

        worm.active = false;

        worm.state = "idle";

        worm.segments = [];

        wormTimer =
            random(
                7,
                16
            );

        wormStatus.style.opacity = 0;

        if (
            beams.length === 0
        ) {
            warningEl.style.opacity = 0;
        }
    }

    /*
       Worm is dangerous.
    */

    if (
        distance(
            worm,
            player
        ) <
        worm.radius +
        player.radius
    ) {

        failGame();
    }
}

/* ============================================================
   WORM SEGMENTS
============================================================ */

function updateWormSegments() {

    if (
        !worm.segments.length
    ) {
        return;
    }

    worm.segments[0].x =
        worm.x;

    worm.segments[0].y =
        worm.y;

    for (
        let i = 1;
        i < worm.segments.length;
        i++
    ) {

        const previous =
            worm.segments[
                i - 1
            ];

        const current =
            worm.segments[i];

        const dx =
            previous.x -
            current.x;

        const dy =
            previous.y -
            current.y;

        const d =
            Math.hypot(
                dx,
                dy
            );

        if (
            d >
            worm.spacing
        ) {

            const move =
                (
                    d -
                    worm.spacing
                ) *
                .75;

            current.x +=
                dx /
                d *
                move;

            current.y +=
                dy /
                d *
                move;
        }
    }
}

/* ============================================================
   WORM EATING
============================================================ */

function wormEatThings() {

    /*
       ASTEROIDS
    */

    for (
        let i =
            asteroids.length - 1;
        i >= 0;
        i--
    ) {

        const a =
            asteroids[i];

        if (
            distance(
                worm,
                a
            ) <
            worm.radius +
            a.radius
        ) {

            asteroids.splice(
                i,
                1
            );

            score +=
                a.size *
                10;

            createExplosion(
                a.x,
                a.y,
                15
            );

            shake =
                Math.min(
                    10,
                    shake + 2
                );

            worm.target = null;

            updateScore();
        }
    }

    /*
       SHOOTING STARS
    */

    for (
        let i =
            shootingStars.length - 1;
        i >= 0;
        i--
    ) {

        const s =
            shootingStars[i];

        if (
            distance(
                worm,
                s
            ) < 60
        ) {

            shootingStars.splice(
                i,
                1
            );

            score += 15;

            createExplosion(
                s.x,
                s.y,
                10
            );

            updateScore();
        }
    }

    /*
       ALIENS
    */

    for (
        let i =
            aliens.length - 1;
        i >= 0;
        i--
    ) {

        const a =
            aliens[i];

        if (
            distance(
                worm,
                a
            ) <
            worm.radius +
            25
        ) {

            aliens.splice(
                i,
                1
            );

            score += 75;

            createExplosion(
                a.x,
                a.y,
                25
            );

            updateScore();
        }
    }

    /*
       BULLETS
    */

    for (
        let i =
            bullets.length - 1;
        i >= 0;
        i--
    ) {

        const b =
            bullets[i];

        if (
            distance(
                worm,
                b
            ) <
            worm.radius
        ) {

            bullets.splice(
                i,
                1
            );

            createExplosion(
                b.x,
                b.y,
                3
            );
        }
    }
}

/* ============================================================
   WORM DRAW
============================================================ */

  function drawWorm() {
    if (!worm.active) return;

    for (let i = worm.segments.length - 1; i >= 0; i--) {
        const s = worm.segments[i];

        const wobble =
            Math.sin(performance.now() * .006 + i * .7) * 3;

        const radius =
            s.size * (i === 0 ? 1 : .88);

        ctx.save();

        ctx.translate(s.x + wobble, s.y);

        ctx.shadowBlur = 18;
        ctx.shadowColor = "#ff28ff";

        ctx.strokeStyle =
            i === 0
                ? "#ffffff"
                : "#e06cff";

        ctx.lineWidth = 3;

        ctx.beginPath();
        ctx.arc(0, 0, radius, 0, Math.PI * 2);
        ctx.stroke();

        ctx.strokeStyle = "#ff9cff";
        ctx.lineWidth = 1;

        ctx.beginPath();
        ctx.arc(0, 0, radius * .72, 0, Math.PI * 2);
        ctx.stroke();

        ctx.restore();
    }

    // Worm head
    ctx.save();

    ctx.translate(worm.x, worm.y);
    ctx.rotate(worm.angle);

    const r = worm.radius;

    ctx.shadowBlur = 30;
    ctx.shadowColor = "#ff28ff";

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 3;

    ctx.beginPath();
    ctx.ellipse(
        0,
        0,
        r * 1.35,
        r,
        0,
        0,
        Math.PI * 2
    );
    ctx.stroke();

    ctx.strokeStyle = "#ff28ff";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.ellipse(
        0,
        0,
        r * 1.1,
        r * .78,
        0,
        0,
        Math.PI * 2
    );
    ctx.stroke();

    // Eyes as outlined circles
    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 2;

    ctx.beginPath();
    ctx.arc(-5, -17, 7, 0, Math.PI * 2);
    ctx.arc(-5, 17, 7, 0, Math.PI * 2);
    ctx.stroke();

    ctx.restore();
}


/* ============================================================
   PARTICLES
============================================================ */

function createExplosion(
    x,
    y,
    amount
) {

    const count =
        Math.floor(
            amount * 1.2
        );

    for (
        let i = 0;
        i < count;
        i++
    ) {

        const a =
            random(
                0,
                Math.PI * 2
            );

        const speed =
            random(
                1,
                5
            );

        particles.push({

            x,
            y,

            vx:
                Math.cos(a) *
                speed,

            vy:
                Math.sin(a) *
                speed,

            size:
                random(
                    1,
                    4
                ),

            life:
                random(
                    .3,
                    .9
                ),

            maxLife: .9,

            type: "explosion"
        });
    }
}

function updateParticles(dt) {

    for (
        let i =
            particles.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particles[i];

        p.x +=
            p.vx *
            dt *
            60;

        p.y +=
            p.vy *
            dt *
            60;

        p.vx *= .97;
        p.vy *= .97;

        p.life -= dt;

        if (
            p.life <= 0
        ) {

            particles.splice(
                i,
                1
            );
        }
    }
}

function drawParticles() {

    for (
        const p of particles
    ) {

        const alpha =
            Math.max(
                0,
                p.life /
                p.maxLife
            );

        ctx.save();

        ctx.globalAlpha =
            alpha;

        if (
            p.type === "ice"
        ) {

            ctx.fillStyle =
                "#b9f5ff";

        } else if (
            p.type === "smoke"
        ) {

            ctx.fillStyle =
                "#8e9aa8";

        } else if (
            p.type === "bullet"
        ) {

            ctx.fillStyle =
                "#ffffff";

        } else {

            ctx.shadowBlur = 10;
ctx.shadowColor = "#a9dfff";
ctx.strokeStyle = "#ffffff";
ctx.lineWidth = 1.5;
        }

       ctx.beginPath();

ctx.arc(
    p.x,
    p.y,
    p.size,
    0,
    Math.PI * 2
);

ctx.stroke();
    }
}

/* ============================================================
   COLLISIONS
============================================================ */

function checkCollisions() {

    /*
       BULLETS -> ASTEROIDS
    */

    for (
        let bi =
            bullets.length - 1;
        bi >= 0;
        bi--
    ) {

        const b =
            bullets[bi];

        let hit = false;

        for (
            let ai =
                asteroids.length - 1;
            ai >= 0;
            ai--
        ) {

            const a =
                asteroids[ai];

            if (
                Math.hypot(
                    b.x - a.x,
                    b.y - a.y
                ) <
                a.radius +
                b.radius
            ) {

                splitAsteroid(
                    ai
                );

                bullets.splice(
                    bi,
                    1
                );

                hit = true;

                break;
            }
        }

        if (hit) {
            continue;
        }

        /*
           NEVER SHOOT SATELLITES
        */

        for (
            const s of satellites
        ) {

            if (
                Math.hypot(
                    b.x - s.x,
                    b.y - s.y
                ) <
                s.radius +
                b.radius
            ) {

                failGame();

                return;
            }
        }

        /*
           BULLETS -> ALIENS
        */

        for (
            let ai =
                aliens.length - 1;
            ai >= 0;
            ai--
        ) {

            const a =
                aliens[ai];

            if (
                Math.hypot(
                    b.x - a.x,
                    b.y - a.y
                ) <
                28
            ) {

                aliens.splice(
                    ai,
                    1
                );

                bullets.splice(
                    bi,
                    1
                );

                score += 50;

                createExplosion(
                    a.x,
                    a.y,
                    22
                );

                updateScore();

                break;
            }
        }
    }

    /*
       PLAYER -> ASTEROIDS
    */

    for (
        const a of asteroids
    ) {

        if (
            distance(
                player,
                a
            ) <
            player.radius +
            a.radius * .8
        ) {

            failGame();
            return;
        }
    }

    /*
       PLAYER -> SHOOTING STARS
    */

    for (
        const s of shootingStars
    ) {

        if (
            distance(
                player,
                s
            ) <
            20
        ) {

            failGame();
            return;
        }
    }

    /*
       PLAYER -> SATELLITES
    */

    for (
        const s of satellites
    ) {

        if (
            distance(
                player,
                s
            ) <
            player.radius +
            s.radius
        ) {

            failGame();
            return;
        }
    }
}

/* ============================================================
   CHAOS EVENTS
============================================================ */

function triggerChaos() {

    const event =
        Math.floor(
            random(0, 4)
        );

    chaosStatus.style.opacity = 1;

    /*
       ASTEROID STORM
    */

    if (event === 0) {

        chaosStatus.textContent =
            "☄ ASTEROID STORM";

        for (
            let i = 0;
            i < 9;
            i++
        ) {

            const edge =
                Math.floor(
                    random(0, 4)
                );

            let x;
            let y;
            let targetAngle;

            if (edge === 0) {

                x = random(0, W);
                y = -70;

                targetAngle =
                    Math.atan2(
                        random(0, H),
                        x -
                        W / 2
                    );
            }

            else if (edge === 1) {

                x = W + 70;
                y = random(0, H);

                targetAngle =
                    Math.atan2(
                        H / 2 - y,
                        -W
                    );
            }

            else if (edge === 2) {

                x = random(0, W);
                y = H + 70;

                targetAngle =
                    Math.atan2(
                        -H,
                        W / 2 - x
                    );
            }

            else {

                x = -70;
                y = random(0, H);

                targetAngle =
                    Math.atan2(
                        H / 2 - y,
                        W
                    );
            }

            createAsteroid(
                Math.random() < .3
                ? 3
                : 1 + Math.floor(
                    Math.random() * 2
                ),
                x,
                y,
                targetAngle
            );
        }
    }

    /*
       SHOOTING STAR BURST
    */

    else if (event === 1) {

        chaosStatus.textContent =
            "☄ SHOOTING STAR BURST";

        for (
            let i = 0;
            i < 10;
            i++
        ) {

            setTimeout(
                () => {

                    if (
                        gameRunning
                    ) {
                        createShootingStar();
                    }

                },
                i * 120
            );
        }
    }

    /*
       ALIEN SWARM
    */

    else if (event === 2) {

        chaosStatus.textContent =
            "🛸 ALIEN SWARM";

        for (
            let i = 0;
            i < 4;
            i++
        ) {

            createAlien();
        }
    }

    /*
       TOTAL CHAOS
    */

    else {

        chaosStatus.textContent =
            "⚠ TOTAL CHAOS";

        for (
            let i = 0;
            i < 5;
            i++
        ) {

            createAsteroid(
                Math.random() < .4
                ? 2
                : 1
            );
        }

        for (
            let i = 0;
            i < 6;
            i++
        ) {

            createShootingStar();
        }

        createAlien();

        if (
            !worm.active &&
            Math.random() < .6
        ) {

            wormTimer = 0;
        }

        shake = 15;
    }

    setTimeout(
        () => {

            if (
                gameRunning
            ) {

                chaosStatus.style.opacity = 0;
            }

        },
        2300
    );
}

/* ============================================================
   SCORE
============================================================ */

function updateScore() {

    scoreEl.textContent =
        score;

    if (
        score >
        highScore
    ) {

        highScoreEl.textContent =
            score;
    }
}

/* ============================================================
   GAME START
============================================================ */

function startGame() {

    homeScreen.classList.add(
        "hidden"
    );

    failScreen.classList.add(
        "hidden"
    );

    hud.classList.remove(
        "hidden"
    );

    gameRunning = true;

    paused = false;

    score = 0;

    resetPlayer();

    asteroids.length = 0;
    bullets.length = 0;
    particles.length = 0;
    aliens.length = 0;
    satellites.length = 0;
    shootingStars.length = 0;
    beams.length = 0;

    worm.active = false;
    worm.state = "idle";
    worm.segments = [];

    spawnTimer = 0;

    alienTimer = 3;

    satelliteTimer = 8;

    starTimer = 2;

    chaosTimer = 10;

    wormTimer =
        random(
            7,
            12
        );

    warningEl.style.opacity = 0;

    tractorStatus.style.opacity = 0;

    wormStatus.style.opacity = 0;

    chaosStatus.style.opacity = 0;

    /*
       Initial asteroid field.
    */

    for (
        let i = 0;
        i < 5;
        i++
    ) {

        createAsteroid(3);
    }

    /*
       Initial alien.
    */

    createAlien();

    lastTime =
        performance.now();

    requestAnimationFrame(
        gameLoop
    );
}

/* ============================================================
   GAME OVER
============================================================ */

function failGame() {

    if (!gameRunning) {
        return;
    }

    gameRunning = false;

    player.alive = false;

    finalScoreEl.textContent =
        score;

    let becameHigh = false;

    if (
        score >
        highScore
    ) {

        highScore =
            score;

        localStorage.setItem(
            "spaceChaosHighScore",
            highScore
        );

        becameHigh = true;
    }

    highScoreEl.textContent =
        highScore;

    newHighEl.classList.toggle(
        "hidden",
        !becameHigh
    );

    hud.classList.add(
        "hidden"
    );

    failScreen.classList.remove(
        "hidden"
    );

    warningEl.style.opacity = 0;
    wormStatus.style.opacity = 0;
}

/* ============================================================
   UPDATE
============================================================ */

function update(dt) {

    if (
        !gameRunning ||
        paused
    ) {
        return;
    }

    updatePlayer(dt);

    updateBullets(dt);

    updateAsteroids(dt);

    updateAliens(dt);

    updateSatellites(dt);

    updateShootingStars(dt);

    updateBeams(dt);

    updateWorm(dt);

    updateParticles(dt);

    checkCollisions();

    /*
       ASTEROID SPAWNING
    */

    spawnTimer -= dt;

    if (
        spawnTimer <= 0
    ) {

        spawnAsteroid();

        const difficulty =
            Math.min(
                score / 500,
                1
            );

        spawnTimer =
            Math.max(
                .5,
                1.7 -
                difficulty
        );
    }

    /*
       ALIEN SPAWNING
    */

    alienTimer -= dt;

    if (
        alienTimer <= 0
    ) {

        createAlien();

        if (
            score > 250 &&
            Math.random() < .35
        ) {

            createAlien();
        }

        alienTimer =
            Math.max(
                2.5,
                random(5, 9) -
                score / 800
            );
    }

    /*
       SATELLITES
    */

    satelliteTimer -= dt;

    if (
        satelliteTimer <= 0
    ) {

        createSatellite();

        satelliteTimer =
            random(
                12,
                20
            );
    }

    /*
       SHOOTING STARS
    */

    starTimer -= dt;

    if (
        starTimer <= 0
    ) {

        createShootingStar();

        if (
            Math.random() < .25
        ) {

            createShootingStar();
        }

        starTimer =
            Math.max(
                .7,
                3 -
                score / 800
            );
    }

    /*
       CHAOS EVENTS
    */

    chaosTimer -= dt;

    if (
        chaosTimer <= 0
    ) {

        triggerChaos();

        chaosTimer =
            random(
                8,
                14
            );
    }

    /*
       SCREEN SHAKE
    */

    shake *=
        Math.pow(
            .85,
            dt * 60
        );

    if (
        shake < .05
    ) {
        shake = 0;
    }

    updateScore();
}

/* ============================================================
   DRAW
============================================================ */

function draw() {

    ctx.save();

    if (
        shake > .2
    ) {

        ctx.translate(
            random(
                -shake,
                shake
            ),

            random(
                -shake,
                shake
            )
        );
    }

    drawBackground(0);

    drawShootingStars();

    drawSatellites();

    drawAsteroids();

    drawAliens();

    drawBeams();

    /*
       WORM GOES OVER THE WORLD
       SO IT FEELS HUGE.
    */

    drawWorm();

    drawBullets();

    drawParticles();

    drawPlayer();

    ctx.restore();

    /*
       PAUSE
    */

    if (
        paused &&
        gameRunning
    ) {

        ctx.fillStyle =
            "rgba(0,0,0,.5)";

        ctx.fillRect(
            0,
            0,
            W,
            H
        );

        ctx.textAlign =
            "center";

        ctx.fillStyle =
            "#fff";

        ctx.font =
            "bold 50px Arial";

        ctx.fillText(
            "PAUSED",
            W / 2,
            H / 2
        );

        ctx.font =
            "15px Arial";

        ctx.fillStyle =
            "#9fb4c8";

        ctx.fillText(
            "PRESS P TO RESUME",
            W / 2,
            H / 2 + 35
        );
    }
}

/* ============================================================
   GAME LOOP
============================================================ */

function gameLoop(time) {

    if (!gameRunning) {
        return;
    }

    const dt =
        Math.min(
            .033,
            (time - lastTime) /
            1000
        );

    lastTime = time;

    update(dt);

    draw();

    if (
        gameRunning
    ) {

        requestAnimationFrame(
            gameLoop
        );
    }
}

/* ============================================================
   BUTTONS
============================================================ */

startButton.addEventListener(
    "click",
    startGame
);

replayButton.addEventListener(
    "click",
    startGame
);

homeButton.addEventListener(
    "click",
    () => {

        gameRunning = false;

        failScreen.classList.add(
            "hidden"
        );

        hud.classList.add(
            "hidden"
        );

        homeScreen.classList.remove(
            "hidden"
        );
    }
);

/* ============================================================
   MOBILE
============================================================ */

canvas.addEventListener(
    "touchstart",
    e => {

        if (
            e.touches.length > 0
        ) {

            mouse.x =
                e.touches[0].clientX;

            mouse.y =
                e.touches[0].clientY;

            mouse.down = true;
        }
    }
);

canvas.addEventListener(
    "touchmove",
    e => {

        if (
            e.touches.length > 0
        ) {

            mouse.x =
                e.touches[0].clientX;

            mouse.y =
                e.touches[0].clientY;
        }
    }
);

canvas.addEventListener(
    "touchend",
    () => {

        mouse.down = false;
    }
);
